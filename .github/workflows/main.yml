name: .NET CI    # Название workflow

on:
  push:    # Запускать workflow при пуше в ветку main
    branches: [ "main" ]
  pull_request: # Запускать workflow при создании pull request в ветку main
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest   # Выбираем виртуальную машину с Ubuntu для выполнения шагов

    steps:
    - uses: actions/checkout@v3  # Клонирование кода репозитория

    - name: Setup .NET
      uses: actions/setup-dotnet@v3  # Установка .NET SDK
      with:
        dotnet-version: '8.0.x'  # Версия .NET SDK

    - name: Restore dependencies
      run: dotnet restore CalculatorApp/CalculatorApp.csproj  # Указываем путь к основному проекту

    - name: Build
      run: dotnet build CalculatorApp/CalculatorApp.csproj --no-restore  # Сборка основного проекта

    - name: Test
      run: dotnet test CalculatorApp.Tests/CalculatorApp.Tests.csproj --no-build  # Запуск тестов
